<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin — Davide Luongo</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050d18;
      --bg-card: #0b1929;
      --border: rgba(56, 139, 253, 0.15);
      --accent: #38bdf8;
      --accent-dim: #0ea5e9;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --error: #f87171;
      --success: #34d399;
      --radius: 12px;
      --shadow: 0 0 40px rgba(56, 189, 248, 0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(56, 189, 248, 0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(168, 85, 247, 0.04) 0%, transparent 50%);
    }
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow);
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .logo h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.25rem;
    }
    .logo p { font-size: 0.85rem; color: var(--text-muted); }
    .form-group { margin-bottom: 1.25rem; }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    .otp-input-field {
      text-align: center;
      letter-spacing: 0.35em;
      font-size: 1.5rem !important;
      font-weight: 700;
      color: var(--accent) !important;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.875rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }
    .btn:hover:not(:disabled) { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-link {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 0.25rem;
      margin-top: 0.75rem;
      display: inline-block;
    }
    .alert {
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      margin-top: 1rem;
      display: none;
    }
    .alert.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--error); }
    .alert.success { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3); color: var(--success); }
    .alert.info { background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.3); color: var(--accent); }
    .alert[aria-live] { display: block; }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { font-size: 0.8rem; color: var(--error); margin-top: 0.25rem; display: none; }
  </style>
</head>
<body>
  <main class="login-card" role="main">
    <div class="logo" aria-hidden="true">
      <div class="logo-icon">📷</div>
      <h1>CMS Admin</h1>
      <p>Davide Luongo Photography</p>
    </div>

    <!-- FASE 1: Username & Password -->
    <form id="loginFormPhase1" novalidate aria-label="Modulo di accesso amministrativo (Fase 1)">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required spellcheck="false">
        <span id="username-error" class="error-msg" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <span id="password-error" class="error-msg" role="alert"></span>
      </div>

      <button type="submit" id="submitBtnPhase1" class="btn">
        Continua
      </button>
    </form>

    <!-- FASE 2: Codice OTP Email o Codice Recupero -->
    <form id="loginFormPhase2" novalidate aria-label="Modulo verifica codice OTP (Fase 2)" style="display: none;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <span style="font-size: 2rem;">🔐</span>
        <h3 style="font-size: 1.1rem; margin: 0.5rem 0 0.25rem 0; color: var(--text);">Verifica a Due Fattori</h3>
        <p id="otpInfoText" style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5;">
          Abbiamo inviato un codice OTP a 6 cifre alla tua email.
        </p>
      </div>

      <div class="form-group">
        <label for="otpCode" id="otpLabel" style="text-align: center;">Codice OTP (6 cifre)</label>
        <input type="text" id="otpCode" name="otpCode" class="otp-input-field" maxlength="10" placeholder="••••••" required autocomplete="one-time-code">
        <span id="otp-error" class="error-msg" role="alert" style="text-align: center;"></span>
      </div>

      <button type="submit" id="submitBtnPhase2" class="btn">
        Verifica ed Entra
      </button>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; flex-wrap: wrap;">
        <button type="button" id="resendOtpBtn" class="btn-link" style="color: var(--text-muted);">
          Reinvia codice (60s)
        </button>
        <button type="button" id="toggleRecoveryBtn" class="btn-link">
          Usa codice di recupero
        </button>
      </div>
    </form>

    <div id="alertMsg" class="alert" role="alert" aria-live="polite"></div>
  </main>

  <script>
    let challengeToken = '';
    let cooldownTimer = null;
    let isRecoveryMode = false;

    const formPhase1 = document.getElementById('loginFormPhase1');
    const formPhase2 = document.getElementById('loginFormPhase2');
    const alertMsg = document.getElementById('alertMsg');
    const submitBtnPhase1 = document.getElementById('submitBtnPhase1');
    const submitBtnPhase2 = document.getElementById('submitBtnPhase2');
    const resendOtpBtn = document.getElementById('resendOtpBtn');
    const toggleRecoveryBtn = document.getElementById('toggleRecoveryBtn');
    const otpCodeInput = document.getElementById('otpCode');
    const otpLabel = document.getElementById('otpLabel');

    function showAlert(text, type = 'error') {
      alertMsg.textContent = text;
      alertMsg.className = 'alert ' + type;
      alertMsg.style.display = 'block';
    }

    function hideAlert() {
      alertMsg.style.display = 'none';
      alertMsg.textContent = '';
    }

    function startCooldown(seconds) {
      let rem = seconds;
      resendOtpBtn.disabled = true;
      resendOtpBtn.textContent = `Reinvia codice (${rem}s)`;
      if (cooldownTimer) clearInterval(cooldownTimer);
      cooldownTimer = setInterval(() => {
        rem--;
        if (rem <= 0) {
          clearInterval(cooldownTimer);
          resendOtpBtn.disabled = false;
          resendOtpBtn.textContent = 'Reinvia codice';
        } else {
          resendOtpBtn.textContent = `Reinvia codice (${rem}s)`;
        }
      }, 1000);
    }

    // Fase 1: Invio credenziali
    formPhase1.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showAlert('Inserisci sia username che password.');
        return;
      }

      submitBtnPhase1.disabled = true;
      submitBtnPhase1.innerHTML = '<span class="spinner"></span> Verifica in corso...';

      try {
        const res = await fetch('/api/admin/auth/login-phase1', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Credenziali non valide.');
        }

        challengeToken = data.challengeToken;
        document.getElementById('otpInfoText').textContent = `Abbiamo inviato un codice a 6 cifre a ${data.emailMasked || 'tua email'}.`;
        formPhase1.style.display = 'none';
        formPhase2.style.display = 'block';
        otpCodeInput.focus();
        startCooldown(data.cooldownSeconds || 60);
      } catch (err) {
        showAlert(err.message, 'error');
      } finally {
        submitBtnPhase1.disabled = false;
        submitBtnPhase1.textContent = 'Continua';
      }
    });

    // Fase 2: Verifica OTP o Recovery Code
    formPhase2.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const code = otpCodeInput.value.trim();
      if (!code) {
        showAlert(isRecoveryMode ? 'Inserisci il codice di recupero.' : 'Inserisci il codice OTP a 6 cifre.');
        return;
      }

      submitBtnPhase2.disabled = true;
      submitBtnPhase2.innerHTML = '<span class="spinner"></span> Accesso in corso...';

      try {
        const res = await fetch('/api/admin/auth/login-phase2', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ challengeToken, otpCode: code }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Codice errato o scaduto.');
        }

        showAlert('Accesso autorizzato! Reindirizzamento...', 'success');
        setTimeout(() => {
          window.location.href = '/admin/dashboard.html';
        }, 500);
      } catch (err) {
        showAlert(err.message, 'error');
        submitBtnPhase2.disabled = false;
        submitBtnPhase2.textContent = 'Verifica ed Entra';
      }
    });

    // Reinvia OTP
    resendOtpBtn.addEventListener('click', async () => {
      if (resendOtpBtn.disabled || !challengeToken) return;
      hideAlert();
      resendOtpBtn.disabled = true;
      resendOtpBtn.textContent = 'Invio...';

      try {
        const res = await fetch('/api/admin/auth/resend-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ challengeToken }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Impossibile reinviare il codice.');

        challengeToken = data.challengeToken;
        showAlert('Nuovo codice OTP inviato alla tua email.', 'info');
        startCooldown(data.cooldownSeconds || 60);
      } catch (err) {
        showAlert(err.message, 'error');
        resendOtpBtn.disabled = false;
        resendOtpBtn.textContent = 'Reinvia codice';
      }
    });

    // Toggle Recovery Mode
    toggleRecoveryBtn.addEventListener('click', () => {
      isRecoveryMode = !isRecoveryMode;
      hideAlert();
      if (isRecoveryMode) {
        otpLabel.textContent = 'Codice di Recupero (8 caratteri)';
        otpCodeInput.placeholder = 'XXXXXXXX';
        otpCodeInput.className = '';
        otpCodeInput.maxLength = 16;
        toggleRecoveryBtn.textContent = 'Usa codice OTP email';
        resendOtpBtn.style.display = 'none';
      } else {
        otpLabel.textContent = 'Codice OTP (6 cifre)';
        otpCodeInput.placeholder = '••••••';
        otpCodeInput.className = 'otp-input-field';
        otpCodeInput.maxLength = 6;
        toggleRecoveryBtn.textContent = 'Usa codice di recupero';
        resendOtpBtn.style.display = 'inline-block';
      }
      otpCodeInput.value = '';
      otpCodeInput.focus();
    });
  </script>
</body>
</html>
